name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Tag v0.1.0 -> VERSION 0.1.0; both scripts take the bare version as $1.
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # swift build -c release, assemble LLMActivity.app, build the icon, ad-hoc codesign.
      - name: Build app
        run: bash scripts/make-app.sh "$VERSION"

      # Requires LLMActivity.app from the previous step; emits LLMActivity-$VERSION.dmg.
      - name: Build DMG
        run: bash scripts/make-dmg.sh "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "LLMActivity-$VERSION.dmg" \
            --title "llmactivity $VERSION" \
            --generate-notes
